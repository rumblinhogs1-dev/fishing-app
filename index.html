<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CatchDaddy — AI-Powered Fishing Community</title>
    <meta name="description" content="CatchDaddy: Log catches, identify fish with AI, discover fishing spots, and connect with anglers. Your all-in-one fishing companion." />
    <meta property="og:title" content="CatchDaddy — AI-Powered Fishing Community" />
    <meta property="og:description" content="Log catches, identify fish with AI, discover fishing spots, and connect with anglers." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://catchdaddy.net/fishing-app/logo-512.png" />
    <meta property="og:url" content="https://catchdaddy.net/fishing-app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CatchDaddy — AI-Powered Fishing Community" />
    <meta name="twitter:description" content="Log catches, identify fish with AI, discover fishing spots, and connect with anglers." />
    <meta name="twitter:image" content="https://catchdaddy.net/fishing-app/logo-512.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <meta name="theme-color" content="#2d6a4f" />
  </head>
  <body>
    <div id="root"></div>
    <div id="debug-error" style="display:none;padding:1rem;background:red;color:white;font-family:monospace;font-size:12px;position:fixed;top:0;left:0;right:0;z-index:9999;white-space:pre-wrap;overflow:auto;max-height:50vh"></div>
    <script>
      // Seed --sab so layout is correct before MainActivity injects the real value
      if (/Android/i.test(navigator.userAgent)) {
        document.documentElement.style.setProperty('--sab', '48px');
      }
    </script>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('debug-error');
        el.style.display = 'block';
        el.textContent = 'JS ERROR:\n' + msg + '\n' + (err && err.stack ? err.stack : '') + '\nAt: ' + src + ':' + line;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('debug-error');
        el.style.display = 'block';
        el.textContent = 'UNHANDLED PROMISE:\n' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
